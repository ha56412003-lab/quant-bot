strategies:
  S15_CE_ZLSMA:
    enabled: true
    scan_interval: 15m
    symbols: []
    risk:
      capital_usd: 0
      leverage: 6
      max_position_usd: 0
      risk_per_trade_pct: 0
    # 2026-11-09 浩哥定：16 → 12，并且 engine.py 里去掉「平半后豁免」。
    # 回测（20币/60天/cap5%/1.8R半/移动1.5-1.2）：+94.2R / 回撤 -25.0 / 最长持仓 12.0h
    # 对照 16h豁免的 +87.5R / 46.0h —— 多赚 6.7R 且把最长持仓从 46h 砍到 12h。
    # 那个 +87.5 已经是去掉豁免的数字；保留豁免反而掉到 +86.7 且长尾 42.5h。
    # 实测 12h 是甜蜜点：8h +45.2 / 10h +66.1 / 12h +87.5 / 14h +79.8 / 16h +78.2
    # （11h 的 +93.6 是噪声，曲线不连续，别照着调）
    max_hold_hours: 12
    params:
      kline_interval: 15m
      ce_len: 1
      ce_mult: 2.0
      zlsma_len: 50
      use_close: true
      use_ha: true
      swing_lookback: 20
      min_atr_pct: 0
      bbw_pct_min: 70.0
      # 2026-11-09 浩哥定：30.0 → 5.0
      # 依据实盘 80 笔：止损 ≥5% 的 23 笔（占 29%）合计 -118.78U，均峰值仅 0.32R，
      # 永远够不到 1.8R/2R；止损 3~5% 的 32 笔才是唯一盈利档（+257.81U）。
      # 收紧后剩余 57 笔合计 +225.80U。注意：新单生效，已有持仓不受影响。
      max_risk_pct: 5.0
      min_dev_pct: 0.5
      quickfail_hours: 4.0
      quickfail_min_r: 0.5
      # 2026-11-09 浩哥定：平半线 2.0R → 1.8R，并新增移动止盈 trail_arm / trail_dd。
      # 回测扫描（cap 5% / 12h 强平）：1.8半 + 移动1.5/1.2 = +94.2R 最优；
      # 1.0半+1.2/0.8 只有 +45.9R（1.0 半太早，把 3R+ 的大肉砍光，最好一笔仅 3.02R）。
      # half_tp_r 保持不变（3R 全平）：+94.2R vs 关掉它 +87.5R，两条并存更好。
      half_at_r: 1.8
      half_tp_r: 1.0
      # 移动止盈：峰值 ≥ trail_arm 后，从现在回撤 trail_dd 个 R → 全平剩余半仓。
      # 只在平半之后启用（trail_after_half 语义：arm 1.5 < 平半线 1.8，实际就是平半即武装）。
      # 注意这是「相对回撤」不是「绝对落袋」：峰值 3R 时平在 1.8R，峰值 5R 时平在 3.8R。
      # 实测剩余半仓落袋中位 1.63R、实际回吐中位 1.20R（15m K 线会跳空穿过 1.2R）。
      # 置 0 = 关闭该出场。
      trail_arm: 1.5
      trail_dd: 1.2
      fee_rate: 0.0005
      slip_pct: 0.0
pools:
  candidate:
    size: 200
    refresh_hour: 3
    min_amp_pct: 10.0
    max_amp_pct: 300.0
    vol_days: 30
    whitelist:
    - BTCUSDT
    - ETHUSDT
  monitor:
    size: 40
    min_quote_vol: 5000000
    max_spike: 8.0
    refresh_sec: 60
    min_dwell_sec: 900
    stop_min_pct: 1.0
    stop_exit_pct: 0.85
    eff_min: 0.3
    eff_exit: 0.25
    eff_win: 96
    smooth_sec: 300
    kl_interval: 15m
    daily_refresh_sec: 86400
    tick_sec: 60
