  daily_target:
    enabled: true
    target_usd: 200
    sustain_sec: 30
    auto_close_sec: 5
    pause_new: true
    notify: true
strategies:
  S15_CE_ZLSMA:
    enabled: true
    scan_interval: 15m
    symbols: []
    risk:
      capital_usd: 0
      leverage: 6
      max_position_usd: 0
      risk_per_trade_pct: 0
    max_hold_hours: 16
    params:
      kline_interval: 15m
      ce_len: 1
      ce_mult: 2.0
      zlsma_len: 50
      use_close: true
      use_ha: true
      swing_lookback: 20
      min_atr_pct: 0
      bbw_pct_min: 70.0
      max_risk_pct: 30.0
      rr_ratio: 1.2
      half_at_r: 2.0
      trail_r: 0.8
      ma_confirm_bars: 2
      # ── K5 分段回撤（2026-11-06 浩哥定）──
      # 峰顶还没到 2R 的仓位：连续 5 根收盘破 ZLSMA50 + 从峰顶回撤「浮盈的 50%」才走。
      # 比例而不是固定 0.8R 的原因：峰顶 0.6R 时回撤 0.8R 会倒亏，
      # 改成 50% 就永远留住一半（在 +0.3R 走）。
      # cap 0.8 是上限：峰顶 1.8R 时 50%=0.9R 比原来宽松，卡回 0.8R。
      # 满 2R 之后完全不变，仍是 2 根 + 固定 trail_r，让大赢家放开跑。
      trail_pct: 0.5
      trail_pct_max_r: 2.0
      trail_pct_cap: 0.8
      ma_bars_lt: 5
      # ── 半仓专属出场（2R 平掉一半之后，管剩下那一半）──
      # 三个并列，达到任一就全平。0 = 关闭该条。
      # 默认只开 half_tp_r：浩哥要的是「③不变，再加一条再满 2R 直接走」。
      # 注意 half_dd_pct 的门槛按「平半后新赚的那一段」算，
      # 否则峰顶 3R 回撤 50%=1.5R 会掉到平半价 2R 以下。
      half_tp_r: 2.0
      half_dd_pct: 0.0
      half_dd_r: 0.0
      fee_rate: 0.0002
      slip_pct: 0.0
pools:
  candidate:
    size: 200
    refresh_hour: 3
    min_amp_pct: 10.0
    max_amp_pct: 300.0
    vol_days: 30
    whitelist:
    - BTCUSDT
    - ETHUSDT
  monitor:
    size: 200
    atr_enter_min: 0.4
    atr_exit_max: 0.3
    min_dwell_sec: 1800
    atr_interval: 5m
    min_quote_vol: 10000000
    max_spike: 4.0
    refresh_sec: 300
    scan_sec: 900
    daily_refresh_sec: 86400
    tick_sec: 60
  position:
    max_concurrent: 6
