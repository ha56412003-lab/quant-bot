global:
  universe:
  - BTCUSDT
  - ETHUSDT
  - SOLUSDT
  - BNBUSDT
  - XRPUSDT
  - DOGEUSDT
  - SUIUSDT
  - ADAUSDT
  - AVAXUSDT
  - LINKUSDT
  - TONUSDT
  - TRXUSDT
  - LTCUSDT
  - BCHUSDT
  - NEARUSDT
  - APTUSDT
  - ARBUSDT
  - OPUSDT
  - DOTUSDT
  - POLUSDT
  - INJUSDT
  - SEIUSDT
  - TIAUSDT
  - 1000PEPEUSDT
  - WIFUSDT
  - ORDIUSDT
  - 1000SHIBUSDT
  - FILUSDT
  - ATOMUSDT
  - UNIUSDT
  max_position_pct_per_coin: 10
  max_gross_leverage: 3
  daily_loss_halt_pct: 3
  risk_per_trade_pct: 0.5
  max_concurrent_coins: 8
  max_same_side: 4
  event_quiet_minutes: 30
  fear_greed_extreme:
    greed: 85
    fear: 15
    size_mult: 0.6
  daily_target:
    enabled: true
    target_usd: 200
    sustain_sec: 30
    auto_close_sec: 5
    pause_new: true
    notify: true
strategies:
  S11_CRASH_SCALP:
    enabled: false
    scan_interval: 1
    symbols: []
    risk:
      capital_usd: 0
      leverage: 3
      max_position_usd: 0
      risk_per_trade_pct: 0
    max_hold_hours: 2
    params:
      drop_pct: 1.2
      window_sec: 30
      recent_sec: 3
      decel_ratio: 0.4
      liq_confirm_mult: 3
      require_liq: false
      tp_pct: 0.6
      stop_pct: 0.8
      exhaust_tp_frac: 0.5
      cooldown_sec: 300
      spike_short: true
      min_buffer_sec: 20
  S14_VWAP_REVERT:
    enabled: false
    scan_interval: 1m
    symbols: []
    risk:
      capital_usd: 0
      leverage: 3
      max_position_usd: 0
      risk_per_trade_pct: 0
    max_hold_hours: 0.75
    params:
      dev_pct: 2.0
      taker_conf: 0.95
      exit_frac: 0.5
      cooldown_sec: 600
  S15_CE_ZLSMA:
    enabled: true
    scan_interval: 2m
    symbols: []
    risk:
      capital_usd: 0
      leverage: 3
      max_position_usd: 0
      risk_per_trade_pct: 0
    max_hold_hours: 72
    params:
      kline_interval: 15m
      ce_len: 22
      ce_mult: 3.0
      zlsma_len: 50
      stop_atr_mult: 5.0
      rr_ratio: 1.5
      use_close: true
pools:
  candidate:
    size: 100
    refresh_hour: 3
    min_amp_pct: 10.0
    max_amp_pct: 300.0
    vol_days: 30
    whitelist:
    - BTCUSDT
    - ETHUSDT
  monitor:
    size: 30
    refresh_sec: 3600
    min_quote_vol: 10000000
    max_spike: 4.0
    min_atr_pct: 0.6
  position:
    max_concurrent: 8
    scan_interval: 2m
