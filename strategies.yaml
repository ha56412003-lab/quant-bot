strategies:
  S11_CRASH_SCALP:
    enabled: false
    scan_interval: 1
    symbols: []
    risk:
      capital_usd: 0
      leverage: 3
      max_position_usd: 0
      risk_per_trade_pct: 0
    max_hold_hours: 2
    params:
      drop_pct: 1.2
      window_sec: 30
      recent_sec: 3
      decel_ratio: 0.4
      liq_confirm_mult: 3
      require_liq: false
      tp_pct: 0.6
      stop_pct: 0.8
      exhaust_tp_frac: 0.5
      cooldown_sec: 300
      spike_short: true
      min_buffer_sec: 20
  S14_VWAP_REVERT:
    enabled: false
    scan_interval: 1m
    symbols: []
    risk:
      capital_usd: 0
      leverage: 3
      max_position_usd: 0
      risk_per_trade_pct: 0
    max_hold_hours: 0.75
    params:
      dev_pct: 2.0
      taker_conf: 0.95
      exit_frac: 0.5
      cooldown_sec: 600
  S15_CE_ZLSMA:
    enabled: true
    scan_interval: 2m
    symbols: []
    risk:
      capital_usd: 0
      leverage: 3
      max_position_usd: 0
      risk_per_trade_pct: 0
    # 时间止损：持仓满 16 小时还没到 1.2R 就平（出场④）。
    # 回测（15m / 120 天 / 14 币）：平均持仓 6.9 小时、中位 4.5 小时。
    # 设 4 小时会把一半以上的单子从中间砍断，净 R 从 +21.71 掉到 +5.30。
    max_hold_hours: 16
    params:
      kline_interval: 15m
      # ── 指标参数（对齐浩哥 TradingView 图表：HA + CE(1×2) + ZLSMA50）──
      ce_len: 1
      ce_mult: 2.0
      zlsma_len: 50
      use_close: true
      # 指标输入用 Heikin Ashi 序列。浩哥看图时切的就是 HA 图，
      # 用原始 K 线算出来的买卖点和他在图上看到的对不上。
      use_ha: true
      # ── 入场门槛 ──
      # 止损 = 20 根阶段低点（多头取最低、空头取最高）下方。
      # 用原始 K 线真实价格 —— HA 的 high/low 是合成值，实盘成交不了。
      swing_lookback: 20
      # ATR / 收盘价 > 2.5%。这是生死线：ATR 太小时止损距离不足，
      # 手续费会吃光全部利润（市价单盈亏平衡点 = 止损距离 4.28%）。
      min_atr_pct: 2.5
      # 布林带宽度(20,2) 在过去 100 根里的百分位 > 70%，用来排除震荡。
      # 这是唯一没被数据证伪的震荡过滤器：ADX>25、ADX上升、效率比全部失效
      # （都是滞后指标，等它们确认趋势时行情已经走完）。
      bbw_pct_min: 70.0
      # 止损距离超过 30% 直接放弃这笔（R 太大 → 仓位被压得极小，也防数据异常）
      max_risk_pct: 30.0
      # ── 出场（四条并列，谁先满足谁全平）──
      # ① 止损 = 阶段低点（由 stop_price 表达，引擎判断）
      # ② 止盈 = 1.2R 全平落袋。1.5R 太贪心，震荡市摸不到。
      rr_ratio: 1.2
      # ③ 收盘破 ZLSMA 且从「持仓期最高浮盈」回撤 ≥ 0.8R → 全平。
      #    注意是「从峰顶回撤」，不是「浮盈门槛」——方向搞反会变成
      #    「赚得不够多就不平」，正好相反。
      # ④ 时间止损 = max_hold_hours（16 小时）
      trail_r: 0.8
      # 连续 2 根收盘都在均线另一侧才算真掉头，滤掉单根插针的假突破。
      ma_confirm_bars: 2
      # ── 成本口径 ──
      # 挂单(maker) 0.02% + 零滑点，和回测完全一致。
      # 为什么必须这样：回测里 taker 0.05%+滑点 会把 +8R 变成 -95R，
      # 每笔费用从 0.017R 涨到 0.0425R，数学上直接吃光全部利润。
      # ⚠ 这是「假设挂单能成交」的记账口径。真实限价挂单能力属于执行层，
      #   尚未实现（引擎当前是市价成交）—— 观察期后单独做。
      fee_rate: 0.0002
      slip_pct: 0.0
pools:
  candidate:
    size: 200                 # 100 → 200（2026-11-06 定：扩容让高波动小币有机会进池）
    refresh_hour: 3
    min_amp_pct: 10.0
    max_amp_pct: 300.0
    vol_days: 30
    whitelist:
    - BTCUSDT
    - ETHUSDT
  monitor:
    size: 20                  # 30 → 20（宁缺毋滥，超容量按 ATR 从大到小取）
    refresh_sec: 3600         # ⚠ 暂不改 180：当前代码每轮拉 100 根 1h，改 3 分钟会多 190MB/天
    min_quote_vol: 10000000
    max_spike: 4.0
    min_atr_pct: 1.0          # ⚠ 待代码切到 5m ATR 后生效。1h 口径下 1.0% 等效 5m 的 ~0.2%
    # ── 以下为 2026-11-06 架构改造目标配置，代码尚未读取（待实现）──
    scan_sec: 900             # 池外币 15 分钟扫一次（池内币仍按 refresh_sec）
    atr_interval: 5m          # ATR 用 5 分钟周期
    bbw_interval: 1h          # 布林带宽度用 1 小时周期
    bbw_pct_min: 70.0         # BBW 近 100 根分位门槛
    hold_atr_pct: 0.8         # 已进池的币，ATR 掉到这以上不踢（缓冲带）
    exit_atr_pct: 0.6         # ATR 跌穿这条立刻踢，不管待多久
    min_dwell_sec: 1800       # 进池后最短停留 30 分钟
    sort_by: atr              # 超容量时按 ATR 从大到小取前 N
  position:
    max_concurrent: 8
    scan_interval: 2m
