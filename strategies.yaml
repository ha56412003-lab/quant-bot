  - DOGEUSDT
  - SUIUSDT
  - ADAUSDT
  - AVAXUSDT
  - LINKUSDT
  - TONUSDT
  - TRXUSDT
  - LTCUSDT
  - BCHUSDT
  - NEARUSDT
  - APTUSDT
  - ARBUSDT
  - OPUSDT
  - DOTUSDT
  - POLUSDT
  - INJUSDT
