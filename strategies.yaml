  - TIAUSDT
  - 1000PEPEUSDT
  - WIFUSDT
  - ORDIUSDT
  - 1000SHIBUSDT
  - FILUSDT
  - ATOMUSDT
  - UNIUSDT
  max_position_pct_per_coin: 32.0
  max_gross_leverage: 6
  daily_loss_halt_pct: 10.0
  risk_per_trade_pct: 1.5
  max_concurrent_coins: 8
  max_same_side: 6
  event_quiet_minutes: 30
  fear_greed_extreme:
    greed: 85
    fear: 15
    size_mult: 0.6
  daily_target:
    enabled: true
    target_usd: 200
    sustain_sec: 30
    auto_close_sec: 5
    pause_new: true
    notify: true
strategies:
  S15_CE_ZLSMA:
    enabled: true
    scan_interval: 15m
    symbols: []
    risk:
      capital_usd: 0
      leverage: 6
      max_position_usd: 0
      risk_per_trade_pct: 0
    max_hold_hours: 16
    params:
      kline_interval: 15m
      ce_len: 1
      ce_mult: 2.0
      zlsma_len: 50
      use_close: true
      use_ha: true
      swing_lookback: 20
      min_atr_pct: 0
      bbw_pct_min: 70.0
      max_risk_pct: 30.0
      half_at_r: 2.0
      half_tp_r: 1.0
      fee_rate: 0.0005
      slip_pct: 0.0
pools:
  candidate:
    size: 200
    refresh_hour: 3
    min_amp_pct: 10.0
    max_amp_pct: 300.0
    vol_days: 30
    whitelist:
    - BTCUSDT
    - ETHUSDT
  monitor:
    size: 40
    min_quote_vol: 5000000
    max_spike: 8.0
    refresh_sec: 60
    min_dwell_sec: 900
    stop_min_pct: 1.0
    stop_exit_pct: 0.85
    eff_min: 0.3
    eff_exit: 0.25
    eff_win: 96
    smooth_sec: 300
    kl_interval: 15m
    daily_refresh_sec: 86400
    tick_sec: 60
