global:
  universe:
  - BTCUSDT
  - ETHUSDT
  - SOLUSDT
  - BNBUSDT
  - XRPUSDT
  - DOGEUSDT
  - SUIUSDT
  - ADAUSDT
  - AVAXUSDT
  - LINKUSDT
  - TONUSDT
  - TRXUSDT
  - LTCUSDT
  - BCHUSDT
  - NEARUSDT
  - APTUSDT
  - ARBUSDT
  - OPUSDT
  - DOTUSDT
  - POLUSDT
  - INJUSDT
  - SEIUSDT
  - TIAUSDT
  - 1000PEPEUSDT
  - WIFUSDT
  - ORDIUSDT
  - 1000SHIBUSDT
  - FILUSDT
  - ATOMUSDT
  - UNIUSDT
  max_position_pct_per_coin: 32.0   # 10→32：单笔 1.5% 在止损 1.6% 时需要 9380U 名义，
                                     # 10%×3x 只有 3002U，不改这里风险比例白提
  max_gross_leverage: 6             # 3→6：并发 6 个 × 9380U 名义 = 5.62x，3x 装不下
                                    # ⚠ 全仓模式：接实盘前必须改逐仓(isolated)，否则一个币
                                    #   插针会吃掉共用保证金、连累其他仓位强平
  daily_loss_halt_pct: 10.0         # 7→10：6 个仓位同时止损 = -9%，7% 挡不住
  risk_per_trade_pct: 1.5           # 0.5→1.5：1R = 净值×1.5% ≈ 150U（原 50U）
  max_concurrent_coins: 6           # 3→6：回测实测并发 3 只吃 +18.75R，并发 6 吃 +35.20R
                                    # 被 3 个上限拒掉的 176 笔合计 +19.47R（含 HYPE +10.72R）
  max_same_side: 6                  # 跟并发上限对齐：趋势行情会集中同向，不再额外限方向
  event_quiet_minutes: 30
  fear_greed_extreme:
    greed: 85
    fear: 15
    size_mult: 0.6
  daily_target:
    enabled: true
    target_usd: 800                 # 200→800：1.5% 时 200U 只要 1.33R，30%+ 的日子中午就收工
    sustain_sec: 30
    auto_close_sec: 5
    pause_new: true
    notify: true
strategies:
  S11_CRASH_SCALP:
    enabled: false
    # 原来是 1（= 1 秒）—— 现在虽然是关着的，但一旦有人打开就会把事件循环
    # 和币安权重一起打爆，改成安全默认值。
    scan_interval: 15m
    symbols: []
    risk:
      capital_usd: 0
      leverage: 3
      max_position_usd: 0
      risk_per_trade_pct: 0
    max_hold_hours: 2
    params:
      drop_pct: 1.2
      window_sec: 30
      recent_sec: 3
      decel_ratio: 0.4
      liq_confirm_mult: 3
      require_liq: false
      tp_pct: 0.6
      stop_pct: 0.8
      exhaust_tp_frac: 0.5
      cooldown_sec: 300
      spike_short: true
      min_buffer_sec: 20
  S14_VWAP_REVERT:
    enabled: false
    scan_interval: 1m
    symbols: []
    risk:
      capital_usd: 0
      leverage: 3
      max_position_usd: 0
      risk_per_trade_pct: 0
    max_hold_hours: 0.75
    params:
      dev_pct: 2.0
      taker_conf: 0.95
      exit_frac: 0.5
      cooldown_sec: 600
  S15_CE_ZLSMA:
    enabled: true
    # 15m：策略吃 15 分钟 K 线，一根 K 线 15 分钟才变一次。
    # 之前配的 2m 会让每 2 分钟就把 23 个币的 K 线全重拉一遍（K 线缓存仅 5 秒），
    # 每轮 6~7 次里有 6 次算完发现还是同一根 K 线、直接跳过 —— 纯烧流量
    # （实测约 380MB/天 → 51MB/天）。
    scan_interval: 15m
    symbols: []
    risk:
      capital_usd: 0
      leverage: 6                     # 3→6：必须跟 global.max_gross_leverage 一致。
                                      # engine.py:281 是「策略级优先、全局兜底」，这里留 3 会把全局的 6x
                                      # 覆盖掉 —— 总敞口按 6x 放行、每仓按 3x 记保证金，实盘会保证金不足
      max_position_usd: 0
      risk_per_trade_pct: 0
    # 时间止损：持仓满 16 小时还没到 1.2R 就平（出场④）。
    # 回测（15m / 120 天 / 14 币）：平均持仓 6.9 小时、中位 4.5 小时。
    # 设 4 小时会把一半以上的单子从中间砍断，净 R 从 +21.71 掉到 +5.30。
    max_hold_hours: 16
    params:
      kline_interval: 15m
      # ── 指标参数（对齐浩哥 TradingView 图表：HA + CE(1×2) + ZLSMA50）──
      ce_len: 1
      ce_mult: 2.0
      zlsma_len: 50
      use_close: true
      # 指标输入用 Heikin Ashi 序列。浩哥看图时切的就是 HA 图，
      # 用原始 K 线算出来的买卖点和他在图上看到的对不上。
      use_ha: true
      # ── 入场门槛 ──
      # 止损 = 20 根阶段低点（多头取最低、空头取最高）下方。
      # 用原始 K 线真实价格 —— HA 的 high/low 是合成值，实盘成交不了。
      swing_lookback: 20
      # ⚠ 2026-11-06 定稿（回测矩阵验证）：
      #   · ATR 门槛 → 搬到池子（5m 双档），策略层关闭。
      #     低档币 5m ATR 0.3% ≈ 15m 0.75%，永远过不了 2.5%，选进池也开不了仓。
      #   · BBW 门槛 → 必须留在策略层，且必须是 15 分钟周期。实测：
      #     双档 ATR + 15mBBW>70% = +36.66R（758 笔，回撤 −18.4R，前后两段都正）
      #     双档 ATR + 1h BBW>70% = −36.96R（721 笔）  ← 改 1 小时直接亏
      #     双档 ATR 完全去掉 BBW = −85.20R（1487 笔） ← 更不能去掉
      #     BBW 管「此刻该不该做」，ATR 管「做哪类币」，两道不是一回事。
      min_atr_pct: 0
      bbw_pct_min: 70.0
      # 止损距离超过 30% 直接放弃这笔（R 太大 → 仓位被压得极小，也防数据异常）
      max_risk_pct: 30.0
      # ── 出场（四条并列，谁先满足谁全平）──
      # ① 止损 = 阶段低点（由 stop_price 表达，引擎判断）
      # ② 止盈 = 1.2R 全平落袋。1.5R 太贪心，震荡市摸不到。
      rr_ratio: 1.2          # 仅用于回测/文档口径；线上已改为到 half_at_r 平一半，不再 1.2R 全平
      half_at_r: 2.0         # 浮盈到 2R 平掉一半，剩一半靠「破均线+回落」跑完
      # ③ 收盘破 ZLSMA 且从「持仓期最高浮盈」回撤 ≥ 0.8R → 全平。
      #    注意是「从峰顶回撤」，不是「浮盈门槛」——方向搞反会变成
      #    「赚得不够多就不平」，正好相反。
      # ④ 时间止损 = max_hold_hours（16 小时）
      trail_r: 0.8
      # 连续 2 根收盘都在均线另一侧才算真掉头，滤掉单根插针的假突破。
      ma_confirm_bars: 2
      # ── 成本口径 ──
      # 挂单(maker) 0.02% + 零滑点，和回测完全一致。
      # 为什么必须这样：回测里 taker 0.05%+滑点 会把 +8R 变成 -95R，
      # 每笔费用从 0.017R 涨到 0.0425R，数学上直接吃光全部利润。
      # ⚠ 这是「假设挂单能成交」的记账口径。真实限价挂单能力属于执行层，
      #   尚未实现（引擎当前是市价成交）—— 观察期后单独做。
      fee_rate: 0.0002
      slip_pct: 0.0
pools:
  candidate:
    size: 200                 # 100 → 200（2026-11-06 定：扩容让高波动小币有机会进池）
    refresh_hour: 3
    min_amp_pct: 10.0
    max_amp_pct: 300.0
    vol_days: 30
    whitelist:
    - BTCUSDT
    - ETHUSDT
  monitor:
    size: 200                 # 2026-11-06 晚 浩哥定：23 → 69 → 200
                              #   23→69 的依据：pass_n=69 / monitor_n=22，47 个合格币
                              #   被容量挡在门外；单独扫这 47 个发现有 4 个正在 CE
                              #   翻转（INIT/LIT/FLUID/FOGO），机会被白白扔掉。
                              #   69→200 的原因：放开死亡区后合格币从 38 涨到 200 个，
                              #   而补位排序是「低档取 ATR 最低的」，容量 69 会挑走
                              #   最死的 69 个币、把放开的效果全部抵消。故放开到全收。
                              #   代价：池内刷新从 22 个变 200 个 → refresh_sec 同步
                              #   180 → 300（5 分钟）控流量，约 63 → 138 MB/天。
    # ── ATR 双档：2026-11-06 晚 整套删除 ──
    # 原意「波动太小赚不到钱/太大容易插针」两条都不成立：
    #   · 波动小反而最赚钱：ATR<0.33% 那档每笔 +0.133R，是三档最高
    #   · 插针已有 max_spike 4.0 专门管，不需要 ATR 再管一遍
    # 而且双档带来一个真 bug：出池只看 ATR、不看成交额，币进池后成交额
    #   掉到 100 万也不会被踢出去。现在进出池都用同一把尺子（_judge）：
    #   成交额 >= min_quote_vol 且 插针 <= max_spike。
    # ATR 仍然照常采集（atr_interval 保留），只是不再决定进出池。
    # 删除的参数：atr_band_lo_max / atr_band_hi_min / atr_lo_hold /
    #            atr_lo_exit / atr_hi_hold / atr_hi_exit
    # ── ATR 准入门槛（2026-11-06 晚 浩哥定）──
    #   进池：5m ATR > 1.20% 才进监控池
    #   出池：进池满 30 分钟 + 没被选进持仓池 + ATR < 0.80% → 移除
    #   已进持仓池的币不受 ATR 影响（出场交给策略层）
    atr_enter_min: 1.20       # 进池线（%，5m ATR 严格大于）
    atr_exit_max: 0.80        # 清退线（%）：满 30 分钟且未持仓时跌破就移除
    min_dwell_sec: 1800       # 进池后最短停留 30 分钟
    atr_interval: 5m          # ATR 用 5 分钟（只采集，不再参与准入）
    # BBW 门槛已从池子移除（2026-11-06 回测证伪）：
    #   池子按 1 小时算 BBW 时，双档 ATR + 1hBBW>70 = −36.96R；
    #   而 15m BBW>70（留在策略层）= +36.66R。
    #   原因：1h 近 100 根 = 100 小时（4 天），等它确认趋势行情已走完。
    #   现在 BBW 由策略层按 15 分钟算，池子只管资质（成交额/插针）。
    bbw_interval: "off"       # 加引号！裸写 off 会被 YAML 解析成布尔 False
    bbw_pct_min: 0
    # ── 日线口径门槛 ──
    min_quote_vol: 10000000
    max_spike: 4.0
    # ── 分级刷新 ──
    refresh_sec: 300          # 池内币 5m ATR：5 分钟（池子扩容到 200 后控流量用）
    scan_sec: 900             # 池外币 5m ATR：15 分钟
    bbw_refresh_sec: 3600     # 1h 布林带：每小时
    daily_refresh_sec: 86400  # 日线成交额/插针：每天
    tick_sec: 60              # 主循环节拍
    # 超容量时的补位顺序：代码固定按成交额降序（流动性好的优先），
    # 不再读 sort_by（原来的 sort_by: atr 是死配置，已删除）。
  position:
    # scan_interval 已删：全仓库没有任何代码读它（实际节拍由 main.py 的
    # position_loop 0.5s + factors 的 10s 记账节流决定），留着只会误导人。
    max_concurrent: 6
