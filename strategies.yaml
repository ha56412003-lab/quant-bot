strategies:
  S15_CE_ZLSMA:
    enabled: true
    scan_interval: 15m
    symbols: []
    risk:
      capital_usd: 0
      leverage: 6
      max_position_usd: 0
      risk_per_trade_pct: 0
    # 2026-11-09 浩哥定（最终版）：16 小时，engine.py 里去掉「平半后豁免」。
    #
    # ⚠ 这里走了一大圈，真实原因必须留档：
    #   当天先把 16 改成 12，因为回测说 12h 能 +94.2R 且最长持仓压到 12h。
    #   后来接实盘审计才发现——那条回测漏了「快速失败」（_quick_fail 4h/0.5R），
    #   而线上 check_exit 第一步就是它。补上之后结论整个反转：
    #
    #     12h 强平 + 快速失败   +81.1R / 回撤 -22.7 / 最长 12h   ← 砍掉了 4~12h 的利润出口
    #     16h 强平 + 快速失败   +91.4R / 回撤 -21.4 / 最长 16h   ← 采纳
    #     12h 强平 + 关快速失败 +94.4R / 回撤 -25.0 / 最长 12h
    #     纯原线上 + 快速失败   +100.0R / 回撤 -20.7 / 最长 76h
    #
    #   快速失败和强平在抢同一件事：前者 4h 砍没起色的，后者到点统一平。
    #   12h 太短，正好把「慢性子但最终赚钱」那批（时间止损均笔 +0.60R）砍在
    #   4 小时线上；16h 只砍掉真正到尾的烂尾单，两者才能并存。
    #   三个方案差 3~9R 量级，选 16h 是为了回撤最好（-21.4）且留着早清保护。
    # 2026-11-10 B 档：16h 时间止损整条删除（0 = 关闭；engine.py 已加 0 值保护，
    # 否则 `now - opened >= 0` 会把每个仓位开出来就平掉）
    max_hold_hours: 0
    params:
      kline_interval: 15m
      ce_len: 1
      # 2026-11-10 浩哥定（B 档）：2.0 → 1.5。作者原设计 2.0。
      # 六档实测胜率：1.0 54.4% / 1.25 56.6% / 1.5 57.7%★ / 1.75 56.8% / 2.0 56.4% / 2.5 50.7%
      ce_mult: 1.5
      zlsma_len: 50
      use_close: true
      use_ha: true
      # 2026-11-10 B 档：20 → 8（双止损「8 根摆动 + CE 通道」实测最优，止损距离中位 2.39%→1.96%）
      swing_lookback: 8
      min_atr_pct: 0
      bbw_pct_min: 70.0
      # 2026-11-09 浩哥定：30.0 → 5.0
      # 依据实盘 80 笔：止损 ≥5% 的 23 笔（占 29%）合计 -118.78U，均峰值仅 0.32R，
      # 永远够不到 1.8R/2R；止损 3~5% 的 32 笔才是唯一盈利档（+257.81U）。
      # 收紧后剩余 57 笔合计 +225.80U。注意：新单生效，已有持仓不受影响。
      max_risk_pct: 5.0
      # 2026-11-10 定档：两档止损分界线（%）
      #   三条取近后距离 < 0.50% → 这一档只保留 ②CE 通道（关键K线贴脸时 1R 太小）
      #   回测 60 天 40 币：336 笔 / 54.8% / 1.31 / +52.21R / −13.32R
      dual_stop_min_pct: 0.5
      # 2026-11-10 B 档：固定 0.5% 偏离闸 → 置 0，改由下面的 dev_atr_mult 自适应
      min_dev_pct: 0.0
      # 偏离闸（自适应）：进场价离 ZLSMA ≥ mult × ATR(20)
      #   实测 1.2× 90笔/60.0%/+23.48R ；1.0× 96笔/58.3%（B 档定 1.0）
      #   ⚠ 乘的必须是 ATR(20)，不能是 CE 的 ATR(1)（进场那根 TR 是平时 3~5 倍）
      dev_atr_mult: 1.0
      # 关键K线三条（2026-11-10 浩哥定义，全部用原始 K 线，不用 HA）：
      #   ① 力度：实体 > key_mult × ATR(20)   ② 掌控力：收盘位置 > 0.66
      #   ③ 决断力：实体占全幅 > 0.5
      # key_mult 各档通过率/业绩：1.0 9.34%/3.78单 | 0.8 15.00%/3.78 | 0.7 18.83%/4.65★ | 0.6 23.30%/4.78(质量崩)
      key_bar: true
      key_mult: 0.7
      key_closepos: 0.66
      key_bodyfrac: 0.5
      # 关键K线的低点/高点作为止损线之一（与摆动 8 根、CE 通道三者并列取近）
      stop_key: true
      # 平半线沿革：2.0R → 1.8R → 2026-11-10 B 档定在 1.2R
      #   扫描峰：1.2R 328 笔 / 53.4% / +58.96R（1.0R 太早、1.8R 太晚都不如它）
      # 1.2R 的意义是「锁定不亏」，之后交给右侧止盈 / 2.0R 兜底
      half_at_r: 1.2
      # 最终盈利目标：平半后到 2R 全平（兜底，防止一直不穿均线时无出口）
      full_at_r: 2.0
      # 右侧止盈（2026-11-10 新方案）：平半后 HA 反向 + HA收穿 ZLSMA50
      #   + 那根反向原始K线本身是反向关键K线（strict）
      right_exit: true
      right_exit_strict: true
      # 进场 EFF 闸（2026-11-10 从池子挪到进场闸）
      eff_min_signal: 0.30
      eff_win_signal: 48
      # 止损距离下限（2026-11-11 浩哥定：0.60%）—— 进场第⑤道闸的下限。
      #   为什么要它：手续费按名义仓位收，止损越窄，手续费占 1R 的比例越大。
      #   40币60天按入场止损距离分桶（scripts/exp_four_qs_1111.py C 段）：
      #     0~0.5%   12笔 50.0% -0.230R  费后2R只剩1.63R（手续费吃掉18.4%）
      #     0.5~0.75% 69笔 50.7% -0.011R  ← 这两档是唯一整体亏钱的（合计 -3.6R）
      #     1.0~1.5% 76笔 57.9% +0.287R
      #     1.5~2.5% 55笔 60.0% +0.336R  ← 最好
      #   实测卡 0.60%：单量 5.60→5.03（-10%）、胜率 54.8→55.3%、盈亏比 1.31→1.39、
      #                  净值 +52.21R→+56.68R、回撤 -13.32→-10.25R（五项同时变好）
      #   ★ 注意别和"监控池筛币"混淆：这是进场闸（evaluate 第⑤道），
      #     0 = 关闭。以前删掉的同名池子闸是另一回事。
      min_stop_dist_pct: 0.60
      # 保本移损（2026-11-11 浩哥定：1.5R）—— 峰顶到 N R 后把有效止损抬到入场价。
      #   实现方式：不动 stop_price（它永远是原始止损，所有 R 计算靠它），
      #   而是置 be_on=1；engine 判止损时若 be_on 就用 entry_price 当触发价。
      #   实测（scripts/exp_be12_1111.py）：1.5R 触发 29 笔、净值 +52.54R（比无保本 +0.33R）、
      #   回撤 -13.32→-12.82R、胜率 55.1%（最高）。1.2R 挡 57 笔但少赚 1.48R，故取 1.5。
      #   0 = 关闭。
      be_at_r: 1.5
      # 同一信号时点同向最多开 N 笔（2026-11-11 浩哥定：2）—— 0 = 关闭。
      #   为什么加：同一根 15m K 线，40 个币会同时算出同向信号，那不是 N 个独立
      #   机会，是 1 个机会 × N 个标的（信号共线）。11-10 23:45:22 就因此一秒开了
      #   6 个空单，V 型反转全灭，已平 7 笔 −1,089.71U。
      #   ★ 只限「本轮 evaluate 产生的信号」，不和已有持仓合并 —— 与回测口径一致
      #     （scripts/verify_exit_final.py 的 max_same_bar_side 筛选段）。
      #
      #   ★★ 配对约束：这个键必须和 engine.py 的择优排序方向一起看 ——
      #      2026-11-11 同日把择优排序从 strength 降序改成 strength 升序。
      #      strength = |收盘 − ZLSMA50| / ATR = 离均线多远。
      #      降序 = 留下「追得最狠」的 —— 限笔时把好信号挤掉，实测三项全差。
      #      升序 = 留下「刚翻转、还没跑远」的 —— 这才是低滞后入场。
      #      ⚠ 只改限笔数、不改排序，结论会反过来（曾经在实验里踩过这个坑）。
      #
      #   实测 40 币 × 60 天（scripts/exp_sameside_order_1111.py，排序=strength升序）：
      #     不限            5.03 / 55.3% / 1.37 / +55.02R / −10.03R / 4.38h
      #     ≤2（定这个）    4.35 / 56.3% / 1.43 / +53.75R /  −9.07R / 4.33h
      #     ≤3              4.60 / 56.5% / 1.45 / +59.23R /  −9.07R / 4.29h
      #     ≤4              4.73 / 56.7% / 1.46 / +61.77R /  −9.07R / 4.24h
      #   为什么取 2 不取 4：浩哥 2026-11-11 明确要「同一信号时点同向最多 2 笔」，
      #   目标是压住单次灾难（那波能少亏 472U）；≤4 长期收益更高但拦不住 6 连发。
      #   「同向并发限笔」（任意时刻同向持仓 ≤N）实测全线更差（−2.41 ~ −23.64R），
      #   因为它会拦住不同时点的正常信号 —— 那条路已排除，别再试。
      max_same_bar_side: 2
      fee_rate: 0.0005
      slip_pct: 0.0
pools:
  candidate:
    size: 200
    refresh_hour: 3
    min_amp_pct: 10.0
    max_amp_pct: 300.0
    vol_days: 30
    whitelist:
    - BTCUSDT
    - ETHUSDT
    - HYPEUSDT
    - SOLUSDT
    - XRPUSDT
    - BNBUSDT
    - DOGEUSDT
    - AVAXUSDT
    - NEARUSDT
    - UNIUSDT
    - SUIUSDT
    - ADAUSDT
  monitor:
    # 2026-11-11 浩哥定：40 → 50（scripts/exp_pool_size_1111.py，60 天回测）
    #   40：4.68 单/天 / 54.1% / 1.33 / +45.93R / −9.70R / 4.35h（原定档）
    #   50：5.97 单/天 / 54.5% / 1.32 / +55.88R / −10.37R / 4.25h ← 性价比最高（5.39 vs 4.73）
    #   60：7.05 单/天 / 53.4% / 1.26 / +55.75R / −13.75R / 4.96h（回撤恶化 42%，不取）
    #   80：9.00 单/天 / 50.7% / 1.13 / +36.64R / −17.77R（胜率崩，净值低于 40）
    size: 50
    min_quote_vol: 5000000
    max_spike: 8.0
    refresh_sec: 60
    min_dwell_sec: 300          # 2026-11-10 改 900→300：池子边界极拥挤（第40名DOT 0.345亿 vs 第41名TRX 0.322亿，仅差7.1%），15 分钟会让掉队币白占坑
    # 2026-11-10 定档（浩哥）：止损距离这道闸整条删除（原进 0.5% / 出 0.3%）。
    #   它把 BTC(0.316%) ETH(0.490%) BNB(0.352%) DOGE(0.403%) 全挡在池外。
    #   窄止损改由策略侧「两档止损」处理：距离 <0.50% 时只用 CE 通道。
    # 2026-11-10 B 档：EFF 从池子闸删除（0 = 关闭），改到进场闸（eff_min_signal）
    eff_min: 0.0
    eff_exit: 0.0
    eff_win: 96
    smooth_sec: 300
    kl_interval: 15m
    daily_refresh_sec: 86400
    tick_sec: 60
