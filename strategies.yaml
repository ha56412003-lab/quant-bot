global:
  universe:
  - BTCUSDT
  - ETHUSDT
  - SOLUSDT
  - BNBUSDT
  - XRPUSDT
  - DOGEUSDT
  - SUIUSDT
  - ADAUSDT
  - AVAXUSDT
  - LINKUSDT
  - TONUSDT
  - TRXUSDT
  - LTCUSDT
  - BCHUSDT
  - NEARUSDT
  - APTUSDT
  - ARBUSDT
  - OPUSDT
  - DOTUSDT
  - POLUSDT
  - INJUSDT
  - SEIUSDT
  - TIAUSDT
  - 1000PEPEUSDT
  - WIFUSDT
  - ORDIUSDT
  - 1000SHIBUSDT
  - FILUSDT
  - ATOMUSDT
  - UNIUSDT
  max_position_pct_per_coin: 32.0
  max_gross_leverage: 6
  daily_loss_halt_pct: 10.0
  risk_per_trade_pct: 1.5
  max_concurrent_coins: 6
  max_same_side: 6
  event_quiet_minutes: 30
  fear_greed_extreme:
    greed: 85
    fear: 15
    size_mult: 0.6
  daily_target:
    # 2026-11-07 浩哥定：不关，恢复成开着、金额手动填。
    # 界面上能改全部四项（风控页 → 日目标）：启用 / 金额 / 达标顶住多久 / 提醒后多久砍仓。
    # ⚠ 注意 auto_close_sec 现在是 5 —— 提醒发出 5 秒就强制全平，
    #    你根本来不及反应。建议改成 0（只提醒不砍）或至少 60。
    #    前端会显示红色危险提示，但不会拦住。
    enabled: true
    target_usd: 200
    sustain_sec: 30
    auto_close_sec: 5
    pause_new: true
    notify: true
strategies:
  S15_CE_ZLSMA:
    enabled: true
    scan_interval: 15m
    symbols: []
    risk:
      capital_usd: 0
      leverage: 6
      max_position_usd: 0
      risk_per_trade_pct: 0
    max_hold_hours: 16
    params:
      kline_interval: 15m
      ce_len: 1
      ce_mult: 2.0
      zlsma_len: 50
      use_close: true
      use_ha: true
      swing_lookback: 20
      min_atr_pct: 0
      bbw_pct_min: 70.0
      max_risk_pct: 30.0
      rr_ratio: 1.2
      half_at_r: 2.0
      # ── 出场：开仓条件镜像（2026-11-08 浩哥定案，旧「破均线+回撤」已整段删除）──
      # 做多出场：① CE 方向翻空 ② HA 阴线且 HA收 < ZLSMA50
      # 做空出场：① CE 方向翻多 ② HA 阳线且 HA收 > ZLSMA50
      # 两条必须落在同一根已收盘 K 线上。出场不加布林带条件（详见 strategies.py）。
      # ── 半仓专属出场（2R 平掉一半之后，管剩下那一半）──
      # 只有这一条：再赚 1R（即到 3R）全平。线上口径 6 仓回测（597 笔）：
      #   +61.8R / 均笔+0.104 / 回撤−16.4 / 均持仓 26.5 根
      half_tp_r: 1.0
      # 注意：原来的 half_dd_pct / half_dd_r（半仓后按回撤%或R止盈）已删除。
      # 代码里从来没有实现过这两项 —— 它们写在 yaml 里但 strategies.py 一次都没读，
      # 属于「写了不生效」的空指令，2026-11-08 复盘时清掉。
      # 现在管剩下那一半的只有两条：到 3R 全平，或者中途趋势反转走镜像出场。
      # 手续费：币安 U 本位 VIP0 的 taker 是 0.05%（不是 0.02%）。
      # 原来写 0.0002 = 按 2.5 倍低估成本。100U 本金单笔 30U 名义，
      # 开平各收一次 ≈ 0.03U，占 1.5U 风险的 2%，一天 9 笔 ≈ 8U/月。
      # 若用 BNB 抵扣可降到 0.045%（0.00045），这里按不打折的保守值算。
      fee_rate: 0.0005
      slip_pct: 0.0
pools:
  candidate:
    size: 200
    refresh_hour: 3
    min_amp_pct: 10.0
    max_amp_pct: 300.0
    vol_days: 30
    whitelist:
    - BTCUSDT
    - ETHUSDT
  monitor:
    size: 200
    atr_enter_min: 0.4
    atr_exit_max: 0.3
    min_dwell_sec: 1800
    atr_interval: 5m
    min_quote_vol: 10000000
    max_spike: 4.0
    refresh_sec: 300
    scan_sec: 900
    daily_refresh_sec: 86400
    tick_sec: 60
  position:
    max_concurrent: 6
