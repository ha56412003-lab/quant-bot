strategies:
  S11_CRASH_SCALP:
    enabled: false
    scan_interval: 1
    symbols: []
    risk:
      capital_usd: 0
      leverage: 3
      max_position_usd: 0
      risk_per_trade_pct: 0
    max_hold_hours: 2
    params:
      drop_pct: 1.2
      window_sec: 30
      recent_sec: 3
      decel_ratio: 0.4
      liq_confirm_mult: 3
      require_liq: false
      tp_pct: 0.6
      stop_pct: 0.8
      exhaust_tp_frac: 0.5
      cooldown_sec: 300
      spike_short: true
      min_buffer_sec: 20
  S14_VWAP_REVERT:
    enabled: false
    scan_interval: 1m
    symbols: []
    risk:
      capital_usd: 0
      leverage: 3
      max_position_usd: 0
      risk_per_trade_pct: 0
    max_hold_hours: 0.75
    params:
      dev_pct: 2.0
      taker_conf: 0.95
      exit_frac: 0.5
      cooldown_sec: 600
  S15_CE_ZLSMA:
    enabled: true
    scan_interval: 2m
    symbols: []
    risk:
      capital_usd: 0
      leverage: 3
      max_position_usd: 0
      risk_per_trade_pct: 0
    max_hold_hours: 72
    params:
      kline_interval: 15m
      ce_len: 22
      ce_mult: 3.0
      zlsma_len: 50
      stop_atr_mult: 5.0
      rr_ratio: 1.5
      use_close: true

# ══════════════════════════════════════════════════════════════
# 三层池配置
#   候选池(100) --每天--> 监控池(30) --1小时--> 持仓池(6) --2分钟扫信号-->
# ══════════════════════════════════════════════════════════════
pools:
  candidate:
    size: 100              # 候选池目标数量
    refresh_hour: 3        # 每天几点重建（24 小时制，凌晨低峰）
    min_amp_pct: 10.0      # 30天振幅下限 %（剔除 PAXG 8.3% / USDC 0.3% 这类非加密资产）
    max_amp_pct: 300.0     # 30天振幅上限 %（剔除 JCT 599% / AKE 1745% 这类妖币）
    vol_days: 30           # 用多少天的日线算振幅
    whitelist:             # 自选合约：优先级最高，无条件进候选池
      - BTCUSDT
      - ETHUSDT

  monitor:
    size: 30               # 从候选池里按成交额取前 N 只
    refresh_sec: 3600      # 刷新间隔（秒），3600 = 1 小时
    min_quote_vol: 10000000   # 24h 成交额下限 U（1000 万）
    max_spike: 4.0            # 插针比上限
    min_atr_pct: 0.6          # ATR 占价格比例下限 %

  position:
    max_concurrent: 6      # 并发持仓上限
    scan_interval: 2m      # 信号扫描间隔
